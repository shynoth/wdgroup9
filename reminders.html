<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یادآوری‌ها | Routiva AI</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .container { max-width: 600px; margin: 40px auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        .task-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .task-item:last-child { border-bottom: none; }
        .task-title { font-weight: bold; }
        .task-time { color: #888; font-size: 0.9em; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 0.8em; }
        .done { background: #d4edda; color: #155724; }
        .pending { background: #fff3cd; color: #856404; }
        .back-btn { display: inline-block; margin-top: 20px; text-decoration: none; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 یادآوری‌های شما</h1>
        
        <div class="task-item">
            <div>
                <div class="task-title">رزرو نوبت دکتر</div>
                <div class="task-time">فردا - ساعت ۱۰:۰۰</div>
            </div>
            <span class="badge pending">در انتظار</span>
        </div>

        <div class="task-item">
            <div>
                <div class="task-title">پیگیری سفارش پستی</div>
                <div class="task-time">امروز - ساعت ۱۵:۳۰</div>
            </div>
            <span class="badge done">انجام شد</span>
        </div>

        <a href="home.html" class="back-btn">← بازگشت به صفحه اصلی</a>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
