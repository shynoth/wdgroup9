
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080A14">
    <title>Routiva AI | Notes</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/notes.css">
</head>

<body>

<div class="background-glow"></div>
<div class="grid-overlay"></div>

<header class="notes-header">

    <a href="home.html" class="brand">
        ROUTIVA<span> AI</span>
    </a>

    <div class="notes-actions">

        <select id="languageSelect" aria-label="Language">
            <option value="fa">فارسی</option>
            <option value="en">English</option>
        </select>

        <a href="home.html" class="neon-button"
            data-i18n="backDashboard">
            BACK TO DASHBOARD
        </a>

    </div>

</header>

<main class="notes-container">

    <div class="page-heading">
        <span class="eyebrow">PERSONAL DATABASE</span>
        <h1 data-i18n="notes">Notes</h1>
        <p data-i18n="notesSubtitle">
            Capture your thoughts and ideas.
        </p>
    </div>

    <form id="noteForm" class="cyber-card note-form">

        <input id="noteTitle"
            data-i18n-placeholder="noteTitlePlaceholder"
            placeholder="Note title..."
            required>

        <textarea id="noteContent"
            data-i18n-placeholder="noteContentPlaceholder"
            placeholder="Write something..."
            required></textarea>

        <button type="submit" class="neon-button"
            data-i18n="saveNote">
            SAVE NOTE +
        </button>

    </form>

    <section class="notes-section">

        <h2 data-i18n="savedNotes">SAVED NOTES</h2>

        <div id="notesList" class="notes-grid"></div>

    </section>

</main>

<script src="../js/app.js"></script>
<script src="../js/notes.js"></script>

</body>
</html>
