<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routiva AI - خوش آمدید</title>
  <style>
    :root { --bg: #0f1115; --card: #171a21; --accent: #6c5ce7; --text: #eaeaea; --muted: #9aa0a6; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, Tahoma, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .welcome-box { background: var(--card); padding: 40px 20px; border-radius: 16px; text-align: center; max-width: 400px; width: 100%; border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    h1 { font-size: 2rem; margin-bottom: 10px; background: linear-gradient(90deg, var(--accent), #a29bfe); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: var(--muted); margin-bottom: 30px; line-height: 1.6; }
    .btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 14px 30px; border-radius: 12px; font-weight: bold; transition: 0.2s; width: 100%; }
    .btn:hover { background: #5b4cdb; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="welcome-box">
    <h1>Routiva AI</h1>
    <p>به دستیار هوشمند مدیریت کارها خوش آمدید. برای ورود به داشبورد و مشاهده تسک‌ها کلیک کنید.</p>
    <a href="home.html" class="btn">ورود به داشبورد 🚀</a>
  </div>
</body>
</html>
